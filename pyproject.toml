[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anastruct-plus"
version = "0.2.4"
description = "Plotting and post-processing enhancements for anaStruct"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anastruct>=1.7.0",
    "matplotlib>=3.7",
    "numpy>=1.24",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/eliaszamora/anastruct-plus"
Repository = "https://github.com/eliaszamora/anastruct-plus"

[tool.setuptools.packages.find]
include = ["anastruct_plus*"]
